<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Options Radar">
<title>Options Radar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1116;--card:#161A21;--line:#222833;--line2:#2A313D;
  --tx:#E8ECF2;--tx2:#C3CAD5;--mut:#8B95A5;--acc:#7FB2FF;
  --ok:#5BE09A;--okbg:#173A28;--wa:#FFC53D;--wabg:#3D2F0E;
  --ko:#FF8A8E;--kobg:#3F1719;--nabg:#1E232C;--gold:#E3B341
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:480px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px 110px;display:flex;flex-direction:column;gap:18px}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
h1{margin:0;font-size:26px;font-weight:700}
h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.col{display:flex;flex-direction:column;gap:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.ctitle{font-size:13px;font-weight:600;color:var(--tx2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:26px;border-radius:13px;padding:0 10px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;white-space:nowrap}
.s-ok{background:var(--okbg);color:var(--ok)}
.s-warn{background:var(--wabg);color:var(--wa)}
.s-fail{background:var(--kobg);color:var(--ko)}
.s-na{background:var(--nabg);color:var(--mut)}
.c-ok{color:var(--ok)}.c-warn{color:var(--wa)}.c-fail{color:var(--ko)}.c-na{color:var(--tx2)}
.tk{width:100%;text-align:left;cursor:pointer;color:inherit;font:inherit;display:flex;flex-direction:column;gap:10px}
.note{font-size:12px;color:var(--mut);line-height:1.4}
.sum{border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
label{font-size:12px;color:var(--mut)}
input,select{height:44px;width:100%;border-radius:10px;border:1px solid var(--line2);background:var(--bg);color:var(--tx);padding:0 12px;font-size:16px;font-family:'IBM Plex Mono',monospace;-webkit-appearance:none;appearance:none}
input[type=date]{display:block;min-width:0;line-height:44px}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
.auto{height:44px;border-radius:10px;border:1px dashed var(--line2);color:var(--mut);padding:0 12px;font-family:'IBM Plex Mono',monospace;font-size:15px;display:flex;align-items:center}
.pill{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx2);font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.pill.on{border:1.5px solid var(--acc);background:#1B2A44;color:#fff;font-weight:600}
.btn{height:52px;border-radius:14px;border:none;font:inherit;font-size:16px;font-weight:700;width:100%;cursor:pointer}
.btn.pri{background:var(--acc);color:#0B1220}
.btn.sec{background:var(--card);border:1px solid var(--line2);color:var(--tx);font-weight:600}
.btn.sm{height:44px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.5}
.ibtn{width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--tx2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(11,14,18,.96);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;max-width:130px;height:58px;background:none;border:none;color:var(--mut);font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;position:relative}
.tabs button.on{color:var(--acc)}
.tabs .badge{position:absolute;top:7px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--ko);color:#1A0507;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.lights{background:#07090C;border-radius:22px;padding:10px;display:flex;flex-direction:column;gap:8px}
.light{width:32px;height:32px;border-radius:16px;background:#22272F}
.rule{display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid var(--line);padding:6px 0}
.rule:last-child{border-bottom:none}
.dot{width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.stat .v{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600}
.lab{font-size:12px;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#1B2A44;color:#fff;border:1px solid var(--acc);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;max-width:90vw;text-align:center}
.center{text-align:center;color:var(--mut);padding:40px 0}
.logo{display:inline-flex;align-items:center;justify-content:center;border-radius:8px;background:#F2F4F7;overflow:hidden;flex-shrink:0;color:#0E1116;font-family:'IBM Plex Mono',monospace;font-weight:600}
.logo img{width:70%;height:70%;object-fit:contain}
.mkt{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.salida{border-radius:12px;padding:10px 12px;background:#2E2408;border:1.5px solid var(--gold);color:#FBE6A2;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{height:38px;border:none;border-radius:9px;background:none;color:var(--mut);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.seg button.on{background:#1B2A44;color:#fff}
.bar{height:8px;border-radius:4px;background:var(--nabg);overflow:hidden;position:relative}
.bar span{display:block;height:100%;border-radius:4px}
.bar i{position:absolute;top:0;bottom:0;width:2px;background:var(--mut)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:none}
.kv span:last-child{font-family:'IBM Plex Mono',monospace;text-align:right}
</style>
</head>
<body>
<div id="app"></div>
<script>
const TICKS = ['IWM', 'SPY', 'QQQ', 'AAPL', 'NVDA', 'INTC'];
const ACCIONES = ['AAPL', 'NVDA', 'INTC']; // tienen fecha de earnings
const CFG0 = {
  ancho: 5, cuenta: 5000, riesgoVerde: 1250, riesgoMax: 1500, maxMismoVenc: 2,
  dteMin: 30, dteMax: 45, deltaMax: 0.25,
  benAviso: 50, benObjetivo: 70, dteAviso: 21, dteCierre: 15, stopMult: 2,
  url: '', clave: ''
};
const MOTIVOS = { objetivo: 'Objetivo', stop: 'Stop', tiempo: 'Tiempo', manual: 'Manual' };
const DOMINIOS = { IWM: 'ishares.com', SPY: 'ssga.com', QQQ: 'invesco.com', AAPL: 'apple.com', NVDA: 'nvidia.com', INTC: 'intel.com' };
function logo(t, px) {
  const d = DOMINIOS[t];
  if (!d) return `<span class="logo" style="width:${px}px;height:${px}px;font-size:${Math.round(px * 0.45)}px">${esc((t || '?')[0])}</span>`;
  return `<span class="logo" style="width:${px}px;height:${px}px;font-size:${Math.round(px * 0.45)}px"><img alt="" src="https://www.google.com/s2/favicons?domain=${d}&sz=128" onerror="this.parentNode.textContent='${t[0]}'"></span>`;
}
const st = {
  datos: null, cfg: JSON.parse(JSON.stringify(CFG0)),
  vista: 'radar', f: { t: 'QQQ' }, res: null, reg: null,
  hoja: 'Posiciones', accion: null, enviando: false, cargando: true, error: ''
};

// ---------- utilidades ----------
const num = v => (v === undefined || v === null || v === '') ? NaN : parseFloat(String(v).replace(',', '.'));
const f2 = (x, d = 2) => isFinite(x) ? x.toLocaleString('es-ES', { minimumFractionDigits: d, maximumFractionDigits: d }) : '—';
const pct = (x, d = 1) => isFinite(x) ? f2(x * 100, d) + ' %' : '—';
const usd = (x, d = 0) => isFinite(x) ? (x < 0 ? '−' : '') + f2(Math.abs(x), d) + ' $' : '—';
const esc = s => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const U = t => st.datos && st.datos.subyacentes.find(u => u.ticker === t);
function ncdf(x) {
  const t = 1 / (1 + 0.2316419 * Math.abs(x));
  const d = 0.3989422804 * Math.exp(-x * x / 2);
  const p = d * t * (0.31938153 + t * (-0.356563782 + t * (1.781477937 + t * (-1.821255978 + t * 1.330274429))));
  return x > 0 ? 1 - p : p;
}
// Fechas 'aaaa-mm-dd' a mediodía (sin saltos de zona horaria)
function dia(v) {
  if (!v) return null;
  const d = new Date(String(v).slice(0, 10) + 'T12:00:00');
  return isNaN(d) ? null : d;
}
function hoyISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const hoyMed = () => dia(hoyISO());
const diasA = v => { const d = dia(v); return d ? Math.round((d - hoyMed()) / 864e5) : NaN; };
const fCorta = d => d.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });
const fDM = d => d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
function sumarDias(v, n) { const d = dia(v); d.setDate(d.getDate() + n); return d; }

const ICON = {
  ok: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
  warn: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 6v8M12 18.5v.5"/></svg>',
  fail: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>',
  na: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M7 12h10"/></svg>',
  chev: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  back: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
  reload: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>',
  radar: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12l6-6"/></svg>',
  check: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12l2.5 2.5 5-5"/></svg>',
  pos: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  gear: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  bell: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>'
};

// ---------- carga y envío ----------
function leerLocal(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
function escribirLocal(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function cargarCfg() {
  const c = leerLocal('bp_cfg');
  if (c) { st.cfg = Object.assign({}, CFG0); Object.keys(CFG0).forEach(k => { if (c[k] !== undefined) st.cfg[k] = c[k]; }); }
}
function urlBase() {
  const base = st.cfg.url.trim();
  return base;
}
function cargar() {
  if (!st.cfg.url || !st.cfg.clave) { st.cargando = false; st.vista = 'ajustes'; render(); return Promise.resolve(); }
  st.cargando = true; st.error = ''; render();
  const base = urlBase();
  const u = base + (base.includes('?') ? '&' : '?') + 'k=' + encodeURIComponent(st.cfg.clave.trim()) + '&t=' + Date.now();
  return fetch(u)
    .then(r => r.json())
    .then(d => {
      if (d.error) throw new Error(d.error === 'clave incorrecta' ? 'Clave incorrecta' : d.error);
      st.datos = d; escribirLocal('bp_datos', d);
    })
    .catch(e => {
      st.error = e.message || String(e);
      const c = leerLocal('bp_datos');
      if (c && !st.datos) { st.datos = c; toast('Sin conexión: datos guardados'); }
      else if (st.datos) toast('No se pudo actualizar');
    })
    .finally(() => { st.cargando = false; render(); });
}
// Escritura en la hoja (doPost del Apps Script). text/plain evita el bloqueo CORS.
function enviar(cuerpo, okMsg, despues) {
  if (st.enviando) return;
  st.enviando = true; render();
  fetch(urlBase(), {
    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ k: st.cfg.clave.trim() }, cuerpo))
  })
    .then(r => r.json())
    .then(d => {
      if (d.error) throw new Error(d.error);
      toast(okMsg); if (despues) despues();
      return cargar();
    })
    .catch(e => toast('No se pudo guardar: ' + (e.message || e)))
    .finally(() => { st.enviando = false; render(); });
}
function guardarCfg(msg) { toast(escribirLocal('bp_cfg', st.cfg) ? (msg || 'Guardado') : 'No se pudo guardar'); }
function guardarYCargar() { guardarCfg('Guardado'); st.vista = 'radar'; cargar(); }
function setTxt(path, v) { st.cfg[path] = v.trim(); }
function toast(m) {
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = m;
  document.body.appendChild(d); setTimeout(() => d.remove(), 2600);
}

// ---------- datos derivados ----------
function fedFechas() {
  return ((st.datos && st.datos.fed) || []).map(x => ({ d: dia(x.fecha), sep: x.sep })).filter(x => x.d).sort((a, b) => a.d - b.d);
}
function proximaFed() { const h = hoyMed(); return fedFechas().find(x => x.d >= h) || null; }
function registro(hoja) { return (st.datos && st.datos[hoja === 'Demo' ? 'demo' : 'posiciones']) || []; }
const abiertas = hoja => registro(hoja).filter(p => p.estado !== 'Cerrada');
const cerradas = hoja => registro(hoja).filter(p => p.estado === 'Cerrada');
const riesgoAbierto = hoja => abiertas(hoja).reduce((s, p) => s + (num(p.riesgo) || 0), 0);
function nivelRiesgo(x) { const c = st.cfg; return x <= c.riesgoVerde ? 'ok' : x <= c.riesgoMax ? 'warn' : 'fail'; }
function rsiInfo(r) {
  if (!isFinite(r)) return ['—', 'na'];
  if (r > 70) return ['Sobrecompra', 'warn'];
  if (r >= 40) return ['Sweet spot', 'ok'];
  if (r >= 30) return ['Debilidad', 'warn'];
  return ['Sobreventa', 'fail'];
}

// ---------- filtro de mercado ----------
function vMercado() {
  const m = st.datos && st.datos.mercado;
  const r = m ? num(m.ratio) : NaN;
  if (!isFinite(r)) return `<div class="card note">Filtro de mercado sin datos: revisa la pestaña Mercado de la hoja.</div>`;
  const back = r > 1;
  const col = back ? 'var(--ko)' : 'var(--ok)', bg = back ? '#2A1214' : '#11241A', bd = back ? '#4F2226' : '#1F4A33';
  const fecha = dia(m.fecha), ant = num(m.ratioAnterior);
  let h = '';
  if (m.salida) {
    h += `<div class="salida">${ICON.bell}<span>Salida de backwardation · ${fCorta(dia(m.salida))}</span></div>`;
  }
  h += `<div class="mkt" style="background:${bg};border:1px solid ${bd}">
    <div class="row">
      <div class="col"><span class="lab">Filtro de mercado · VIX / VIX3M</span>
        <span style="font-size:18px;font-weight:700;color:${col}">${back ? 'Backwardation' : 'Contango'}</span></div>
      <div class="col" style="align-items:flex-end"><span class="mono" style="font-size:26px;font-weight:600;color:${col}">${f2(r, 3)}</span>
        <span class="lab">${isFinite(ant) ? 'anterior ' + f2(ant, 3) : ''}</span></div>
    </div>
    <div class="note">VIX ${f2(num(m.vix))} · VIX3M ${f2(num(m.vix3m))}${fecha ? ' · cierre del ' + fDM(fecha) : ''}${back ? ' · mercado en estrés: entra con cautela' : ''}</div>
  </div>`;
  return h;
}

// ---------- gestión de una posición abierta ----------
function gestion(p) {
  const c = st.cfg, cr = num(p.credito), pa = num(p.precioActual), dte = diasA(p.vencimiento);
  const u = U(p.ticker), K = num(p.strikeVendido);
  const al = [];
  let ben = NaN;
  if (isFinite(pa) && cr > 0) {
    ben = (cr - pa) / cr;
    const stopPrecio = cr * (1 + c.stopMult);
    if (pa >= stopPrecio) al.push(['Stop: cerrar', 'fail']);
    else if (ben * 100 >= c.benObjetivo) al.push(['Objetivo ' + c.benObjetivo + ' %: cerrar', 'ok']);
    else if (ben * 100 >= c.benAviso) al.push(['Beneficio ' + f2(ben * 100, 0) + ' %', 'warn']);
  } else al.push(['Sin precio actual', 'na']);
  if (isFinite(dte)) {
    if (dte <= c.dteCierre) al.push(['≤ ' + c.dteCierre + ' DTE: cerrar', 'fail']);
    else if (dte <= c.dteAviso) al.push(['≤ ' + c.dteAviso + ' DTE', 'warn']);
  }
  if (u && isFinite(K) && u.precio <= K) al.push(['Precio bajo el strike', 'fail']);
  const urg = al.some(a => a[1] === 'fail' || (a[1] === 'ok' && a[0].includes('cerrar')));
  return { al, ben, dte, urg };
}
const urgentes = () => abiertas('Posiciones').filter(p => gestion(p).urg).length;

// ---------- radar ----------
function clasificar(u) {
  const c = st.cfg, ch = [], info = [], notas = []; let fail = false, warn = false;
  if (u.tendencia === 'FALLO') { ch.push(['Bajo MM200', 'fail']); fail = true; notas.push('Cierre ' + f2(u.cierre) + ' bajo MM200 ' + f2(u.mm200)); }
  else if (u.tendencia === 'AVISO') { ch.push(['Entre MM50 y MM200', 'warn']); warn = true; }
  else ch.push(['Sobre MM50', 'ok']);
  if (u.ticker === 'NVDA') {
    if (u.pullbackOK) ch.push(['Pullback ' + pct(u.retroceso), 'ok']);
    else { ch.push(['Sin pullback', 'warn']); warn = true; notas.push('Retroceso ' + pct(u.retroceso) + ' (mín. 5 %)'); }
  }
  if (ACCIONES.includes(u.ticker)) {
    const n = diasA(u.earnings);
    if (!isFinite(n)) { ch.push(['Sin fecha earnings', 'warn']); warn = true; notas.push('Añade la fecha en la pestaña Earnings'); }
    else if (n >= 0 && n <= c.dteMax) { ch.push(['Earnings en ' + n + ' d', 'warn']); warn = true; notas.push('Earnings el ' + fDM(dia(u.earnings)) + ': caen dentro de la ventana de ' + c.dteMin + '-' + c.dteMax + ' DTE'); }
  }
  const ri = rsiInfo(u.rsi);
  info.push(['RSI ' + f2(u.rsi, 0) + ' · ' + ri[0], ri[1]]);
  info.push([u.estocasticoOK ? 'Estocástico ↑' : 'Sin cruce estoc.', u.estocasticoOK ? 'ok' : 'na']);
  info.push(['HV20 ' + pct(u.hv20, 0), 'na']);
  return { estado: fail ? 'rojo' : warn ? 'amarillo' : 'verde', ch, info, notas };
}

function validar() {
  leerForm();
  const t = st.f.t, u = U(t), c = st.cfg, S = u.precio;
  const K = num(st.f.strike), cr = num(st.f.credito), iv = num(st.f.iv) / 100, delta = Math.abs(num(st.f.delta)), pw = num(st.f.putwall);
  const venc = dia(st.f.venc);
  if (!isFinite(K) || !isFinite(cr) || !venc) { toast('Rellena vencimiento, strike y crédito'); return; }
  const dias = diasA(st.f.venc);
  const R = [], I = [];
  const add = (name, note, value, s) => R.push({ name, note, value, s });
  const inf = (name, note, value, s) => I.push({ name, note, value, s: s || 'na' });

  add('Tendencia', 'Cierre ' + f2(u.cierre) + ' · MM50 ' + f2(u.mm50) + ' · MM200 ' + f2(u.mm200),
    u.tendencia === 'OK' ? 'Sobre MM50' : u.tendencia === 'AVISO' ? 'MM50-MM200' : 'Bajo MM200',
    u.tendencia === 'OK' ? 'ok' : u.tendencia === 'AVISO' ? 'warn' : 'fail');
  if (t === 'NVDA') add('Pullback NVDA', 'Retroceso desde máx. 10 sesiones (mín. 5 %)', pct(u.retroceso), u.pullbackOK ? 'ok' : 'fail');
  add('DTE de entrada', 'Entre ' + c.dteMin + ' y ' + c.dteMax + ' días', dias + ' d', dias >= c.dteMin && dias <= c.dteMax ? 'ok' : 'fail');
  if (!isFinite(delta)) add('Delta strike corto', 'Introduce la delta (máx. ' + f2(c.deltaMax) + ')', '—', 'warn');
  else add('Delta strike corto', 'Máximo ' + f2(c.deltaMax), '−' + f2(delta), delta <= c.deltaMax ? 'ok' : 'fail');
  if (!(iv > 0)) add('IV > HV20', 'Introduce la IV · HV20 ' + pct(u.hv20), '—', 'warn');
  else add('IV > HV20', 'IV ' + pct(iv) + ' · HV20 ' + pct(u.hv20), iv > u.hv20 ? 'Sí' : 'No', iv > u.hv20 ? 'ok' : 'fail');
  if (t === 'INTC') add('INTC: strike bajo MM200', 'MM200 ' + f2(u.mm200), K < u.mm200 ? 'Sí' : 'No', K < u.mm200 ? 'ok' : 'fail');
  if (ACCIONES.includes(t)) {
    const e = dia(u.earnings);
    if (!e) add('Earnings', 'Sin fecha en la hoja (pestaña Earnings)', '—', 'warn');
    else {
      const dentro = e >= hoyMed() && e <= venc;
      add('Earnings', dentro ? 'Caen antes del vencimiento' : 'Fuera del plazo de la operación', fDM(e), dentro ? 'fail' : 'ok');
    }
  }
  const riesgoOp = (c.ancho - cr) * 100, ra = riesgoAbierto('Posiciones'), total = ra + riesgoOp, nr = nivelRiesgo(total);
  add('Riesgo de cartera', 'Abierto ' + f2(ra, 0) + ' $ + esta ' + f2(riesgoOp, 0) + ' $ · verde ≤ ' + f2(c.riesgoVerde, 0) + ' · máx. ' + f2(c.riesgoMax, 0), f2(total, 0) + ' $', nr);
  const mismo = abiertas('Posiciones').filter(p => p.vencimiento === st.f.venc).length;
  add('Mismo vencimiento', 'Máximo ' + c.maxMismoVenc + ' posiciones', mismo + ' → ' + (mismo + 1), mismo + 1 <= c.maxMismoVenc ? 'ok' : 'fail');

  // Informativos (no cambian el semáforo)
  const m = st.datos.mercado, rm = m ? num(m.ratio) : NaN;
  if (isFinite(rm)) inf('Mercado VIX/VIX3M', rm > 1 ? 'Backwardation' : 'Contango', f2(rm, 3), rm > 1 ? 'fail' : 'ok');
  inf('Distancia al precio', 'Strike frente al precio actual', pct((S - K) / S));
  const ri = rsiInfo(u.rsi);
  inf('RSI 14', ri[0], f2(u.rsi, 0), ri[1]);
  inf('Estocástico 10,3,3', '%K ' + f2(u.k, 0) + ' · %D ' + f2(u.d, 0), u.estocasticoOK ? 'Cruce ↑' : 'Sin cruce', u.estocasticoOK ? 'ok' : 'na');
  if (isFinite(pw)) inf('Put wall', 'Put wall ' + f2(pw), K <= pw ? 'Debajo' : 'Encima', K <= pw ? 'ok' : 'warn');
  const fedEn = fedFechas().filter(x => x.d >= hoyMed() && x.d <= venc);
  inf('FED (FOMC)', fedEn.length ? fedEn.length + ' decisión(es) antes del vencimiento' : 'Ninguna antes del vencimiento', fedEn.length ? fedEn.map(x => fDM(x.d)).join(', ') : '—');

  const T = Math.max(dias, 1) / 365;
  let em = NaN, sig = NaN, prob = NaN;
  if (iv > 0) {
    em = S * iv * Math.sqrt(T);
    sig = Math.log(S / K) / (iv * Math.sqrt(T));
    prob = ncdf((Math.log(S / K) - 0.5 * iv * iv * T) / (iv * Math.sqrt(T)));
  }
  const nf = R.filter(r => r.s === 'fail').length, nw = R.filter(r => r.s === 'warn').length;
  st.res = {
    t, K, cr, dias, venc: st.f.venc, delta, iv, hv20: u.hv20, R, I, em, sig, prob, S, nf, nw,
    nok: R.filter(r => r.s === 'ok').length, estado: nf ? 'rojo' : nw ? 'amarillo' : 'verde'
  };
  ir('res');
}

// ---------- registrar (real o demo) ----------
function abrirReg(hoja) {
  const r = st.res;
  st.reg = {
    hoja, ticker: r.t, vencimiento: r.venc, strikeVendido: r.K, strikeComprado: r.K - st.cfg.ancho,
    credito: r.cr, contratos: 1, fechaEntrada: hoyISO(), delta: isFinite(r.delta) ? r.delta : '',
    iv: r.iv > 0 ? +(r.iv * 100).toFixed(2) : '', hv20: isFinite(r.hv20) ? +(r.hv20 * 100).toFixed(2) : '',
    semaforo: r.estado, notas: ''
  };
  ir('reg');
}
const REG_IDS = ['fechaEntrada', 'vencimiento', 'strikeVendido', 'strikeComprado', 'credito', 'contratos', 'delta', 'iv', 'notas'];

    ${logo(g.ticker, 36)}
    <div class="col"><div class="eyebrow">${demo ? 'Operación demo' : 'Operación real'}</div><h1 style="font-size:22px">${esc(g.ticker)} · registrar</h1></div></div>`;
  h += `<div class="note">${demo ? 'Va a la pestaña Demo. No cuenta para el riesgo de cartera.' : 'Va a la pestaña Posiciones y suma al riesgo de cartera.'} Revisa el crédito real ejecutado.</div>`;
  h += `<div class="card stack" style="gap:14px"><div class="grid2">
    ${inp('credito', 'Crédito real ejecutado ($)')}
    ${inp('contratos', 'Contratos', 'inputmode="numeric"')}
    ${inp('fechaEntrada', 'Fecha de entrada', 'type="date"')}
    ${inp('vencimiento', 'Vencimiento', 'type="date"')}
    ${inp('strikeVendido', 'Strike vendido')}
    ${inp('strikeComprado', 'Strike comprado')}
    ${inp('delta', 'Delta corto')}
    ${inp('iv', 'IV (%)')}
  </div>
  <div class="field"><label for="r_notas">Notas (opcional)</label><input id="r_notas" type="text" style="font-family:'IBM Plex Sans',sans-serif" value="${esc(g.notas)}"></div>
  <div class="row note"><span>HV20 ${f2(num(g.hv20), 1)} % · semáforo ${esc(g.semaforo)}</span></div>
  </div>`;
  h += `<button class="btn pri" ${st.enviando ? 'disabled' : ''} onclick="guardarReg()">${st.enviando ? 'Guardando…' : 'Guardar en ' + g.hoja}</button>`;
  return h;
}
function guardarReg() {
  const g = st.reg;
  REG_IDS.forEach(id => { const e = document.getElementById('r_' + id); if (e) g[id] = e.value; });
  if (!(num(g.credito) > 0) || !(num(g.strikeVendido) > num(g.strikeComprado))) { toast('Revisa crédito y strikes'); return; }
  const datos = Object.assign({}, g); delete datos.hoja;
  enviar({ accion: 'registrar', hoja: g.hoja, datos }, 'Registrada en ' + g.hoja, () => { st.hoja = g.hoja; st.vista = 'pos'; });
}

// ---------- posiciones ----------
function vPos() {
  if (!st.datos) return '';
  const c = st.cfg, hoja = st.hoja, demo = hoja === 'Demo';
  const ab = abiertas(hoja), ce = cerradas(hoja).slice().reverse();
  const ra = riesgoAbierto(hoja), nr = nivelRiesgo(ra);
  let h = `<div class="row" style="align-items:flex-end"><div class="col"><div class="eyebrow">Gestión</div><h1>Posiciones</h1></div>
    <button class="ibtn" aria-label="Actualizar" onclick="cargar()">${ICON.reload}</button></div>`;
  h += `<div class="seg"><button class="${!demo ? 'on' : ''}" onclick="st.hoja='Posiciones';st.accion=null;render()">Reales</button><button class="${demo ? 'on' : ''}" onclick="st.hoja='Demo';st.accion=null;render()">Demo</button></div>`;
  const w = Math.min(100, ra / c.riesgoMax * 100), mark = c.riesgoVerde / c.riesgoMax * 100;
  h += `<div class="card stack" style="gap:8px">
    <div class="row"><span class="ctitle">Riesgo abierto${demo ? ' (demo)' : ''}</span><span class="mono c-${demo ? 'na' : nr}" style="font-weight:600">${f2(ra, 0)} / ${f2(c.riesgoMax, 0)} $</span></div>
    <div class="bar"><span style="width:${w}%;background:var(--${demo ? 'acc' : nr === 'ok' ? 'ok' : nr === 'warn' ? 'wa' : 'ko'})"></span><i style="left:${mark}%"></i></div>
    <div class="note">${ab.length} abierta(s) · ${pct(ra / c.cuenta, 0)} de la cuenta de ${f2(c.cuenta, 0)} $${demo ? ' · no cuenta para el semáforo' : ''}</div></div>`;
  if (!ab.length) h += `<div class="card note">No hay posiciones abiertas${demo ? ' en demo' : ''}. Se añaden desde Validar → Registrar.</div>`;
  ab.sort((a, b) => (a.vencimiento > b.vencimiento ? 1 : -1)).forEach(p => { h += tarjetaPos(p, hoja); });
  if (ce.length) {
    const tot = ce.reduce((s, p) => s + (num(p.resultado) || 0), 0), gan = ce.filter(p => num(p.resultado) > 0).length;
    h += `<div class="row" style="align-items:baseline"><h2 style="color:var(--tx2);text-transform:none;letter-spacing:0;font-size:15px">Cerradas</h2>
      <span class="mono ${tot >= 0 ? 'c-ok' : 'c-fail'}" style="font-size:14px">${usd(tot)} · ${gan}/${ce.length} ganadoras</span></div>`;
    h += `<div class="card" style="padding:4px 14px">` + ce.map(p => `<div class="kv">
      <span><span class="mono">${esc(p.ticker)} ${f2(num(p.strikeVendido), 0)}/${f2(num(p.strikeComprado), 0)}</span> <span class="note">${dia(p.fechaCierre) ? fDM(dia(p.fechaCierre)) : ''} · ${esc(MOTIVOS[p.motivo] || p.motivo)}</span></span>
      <span class="${num(p.resultado) >= 0 ? 'c-ok' : 'c-fail'}">${usd(num(p.resultado))}</span></div>`).join('') + '</div>';
  }
  return h;
}
function tarjetaPos(p, hoja) {
  const c = st.cfg, g = gestion(p), u = U(p.ticker), K = num(p.strikeVendido), cr = num(p.credito), ct = num(p.contratos) || 1;
  const pa = num(p.precioActual), colchon = u && isFinite(K) ? (u.precio - K) / u.precio : NaN;
  const ac = st.accion && st.accion.id === p.id ? st.accion.tipo : '';
  let h = `<div class="card stack" style="gap:10px;${g.urg ? 'border-color:#4F2226' : ''}">
    <div class="row">
      <div style="display:flex;align-items:center;gap:10px">${logo(p.ticker, 32)}
        <div class="col"><span class="mono" style="font-size:16px;font-weight:600">${esc(p.ticker)} ${f2(K, 1)}/${f2(num(p.strikeComprado), 1)} P</span>
        <span class="lab">${dia(p.vencimiento) ? fDM(dia(p.vencimiento)) : '—'} · ${isFinite(g.dte) ? g.dte + ' DTE' : ''} · ${ct} × ${f2(cr)} $</span></div></div>
      <div class="col" style="align-items:flex-end"><span class="lab">Resultado</span>
        <span class="mono ${isFinite(g.ben) ? (g.ben >= 0 ? 'c-ok' : 'c-fail') : 'c-na'}" style="font-weight:600">${isFinite(g.ben) ? f2(g.ben * 100, 0) + ' %' : '—'}</span></div>
    </div>
    <div class="chips">${g.al.map(x => `<span class="chip s-${x[1]}">${esc(x[0])}</span>`).join('')}</div>
    <div class="grid2" style="gap:8px">
      <div class="col"><span class="lab">Subyacente / colchón</span><span class="mono">${u ? f2(u.precio) : '—'} · <span class="${colchon > 0 ? 'c-na' : 'c-fail'}">${pct(colchon)}</span></span></div>
      <div class="col"><span class="lab">Precio spread${p.fechaPrecio ? ' (' + fDM(dia(p.fechaPrecio)) + ')' : ''}</span><span class="mono">${isFinite(pa) ? f2(pa) + ' $ · ' + usd((cr - pa) * 100 * ct) : 'Sin actualizar'}</span></div>
      <div class="col"><span class="lab">Objetivo ${c.benObjetivo} %</span><span class="mono c-ok">${f2(cr * (1 - c.benObjetivo / 100))} $</span></div>
      <div class="col"><span class="lab">Stop</span><span class="mono c-fail">${f2(cr * (1 + c.stopMult))} $</span></div>
    </div>`;
  if (ac === 'actualizar') {
    h += `<div class="stack" style="gap:10px;border-top:1px solid var(--line);padding-top:12px">
      <div class="field"><label for="a_precio">Precio actual del spread ($, de IBKR)</label><input id="a_precio" inputmode="decimal" value="${isFinite(pa) ? esc(pa) : ''}"></div>
      <div class="grid2" style="gap:10px"><button class="btn sec sm" onclick="st.accion=null;render()">Cancelar</button>
      <button class="btn pri sm" ${st.enviando ? 'disabled' : ''} onclick="guardarPrecio('${esc(p.id)}','${hoja}')">Guardar</button></div></div>`;
  } else if (ac === 'cerrar') {
    const sug = g.al.some(a => a[0].startsWith('Stop')) ? 'stop' : g.al.some(a => a[0].startsWith('Objetivo')) ? 'objetivo' : g.al.some(a => a[0].includes('DTE: cerrar')) ? 'tiempo' : 'manual';
    h += `<div class="stack" style="gap:10px;border-top:1px solid var(--line);padding-top:12px">
      <div class="grid2">
        <div class="field"><label for="c_precio">Precio de salida ($)</label><input id="c_precio" inputmode="decimal" value="${isFinite(pa) ? esc(pa) : ''}"></div>
        <div class="field"><label for="c_motivo">Motivo</label><select id="c_motivo">${Object.keys(MOTIVOS).map(k => `<option value="${k}" ${k === sug ? 'selected' : ''}>${MOTIVOS[k]}</option>`).join('')}</select></div>
        <div class="field"><label for="c_fecha">Fecha de cierre</label><input id="c_fecha" type="date" value="${hoyISO()}"></div>
      </div>
      <div class="note">Vencida sin valor: precio de salida 0.</div>
      <div class="grid2" style="gap:10px"><button class="btn sec sm" onclick="st.accion=null;render()">Cancelar</button>
      <button class="btn sm" style="background:var(--ko);color:#1A0507" ${st.enviando ? 'disabled' : ''} onclick="cerrarPos('${esc(p.id)}','${hoja}')">Cerrar posición</button></div></div>`;
  } else {
    h += `<div class="grid2" style="gap:10px">
      <button class="btn sec sm" onclick="st.accion={id:'${esc(p.id)}',tipo:'actualizar'};render()">Actualizar precio</button>
      <button class="btn sec sm" onclick="st.accion={id:'${esc(p.id)}',tipo:'cerrar'};render()">Cerrar</button></div>`;
  }
  return h + '</div>';
}
function guardarPrecio(id, hoja) {
  const v = num(document.getElementById('a_precio').value);
  if (!(v >= 0)) { toast('Precio no válido'); return; }
  enviar({ accion: 'actualizar', hoja, id, precio: v }, 'Precio actualizado', () => { st.accion = null; });
}
function cerrarPos(id, hoja) {
  const v = num(document.getElementById('c_precio').value);
  if (!(v >= 0)) { toast('Precio de salida no válido'); return; }
  enviar({ accion: 'cerrar', hoja, id, precio: v, motivo: document.getElementById('c_motivo').value, fecha: document.getElementById('c_fecha').value },
    'Posición cerrada', () => { st.accion = null; });
}

// ---------- ajustes ----------
function vAjustes() {
  const c = st.cfg;
  const inp = (path, lab) => `<div class="field"><label for="a_${path}">${lab}</label><input id="a_${path}" inputmode="decimal" value="${esc(c[path])}" onchange="setCfg('${path}',this.value)"></div>`;
  const bloque = (titulo, campos) => `<div class="card stack" style="gap:14px"><div class="ctitle">${titulo}</div><div class="grid2">${campos}</div></div>`;
  let h = `<div class="col"><div class="eyebrow">Configuración</div><h1>Ajustes</h1></div>`;
  h += `<div class="card stack" style="gap:14px">
    <div class="ctitle">Conexión con la hoja</div>
    ${!c.url || !c.clave ? '<div class="note">Pega la URL de la aplicación web (la que termina en /exec) y tu clave.</div>' : ''}
    ${st.error ? `<div class="note c-fail">${esc(st.error)}</div>` : ''}
    <div class="field"><label for="a_url">URL de la hoja</label><input id="a_url" type="url" autocapitalize="off" autocorrect="off" value="${esc(c.url)}" onchange="setTxt('url',this.value)" style="font-size:13px"></div>
    <div class="field"><label for="a_clave">Clave</label><input id="a_clave" type="password" autocapitalize="off" autocorrect="off" value="${esc(c.clave)}" onchange="setTxt('clave',this.value)"></div>
    <button class="btn sec" onclick="setTxt('url',document.getElementById('a_url').value);setTxt('clave',document.getElementById('a_clave').value);guardarYCargar()">Guardar y cargar datos</button></div>`;
  h += bloque('Cuenta y riesgo', inp('cuenta', 'Tamaño de la cuenta ($)') + inp('maxMismoVenc', 'Máx. mismo vencimiento') + inp('riesgoVerde', 'Riesgo verde hasta ($)') + inp('riesgoMax', 'Riesgo máximo ($)'));
  h += bloque('Entrada', inp('dteMin', 'DTE mínimo') + inp('dteMax', 'DTE máximo') + inp('deltaMax', 'Delta máx. strike corto') + inp('ancho', 'Ancho del spread ($)'));
  h += bloque('Gestión', inp('benAviso', 'Aviso de beneficio (%)') + inp('benObjetivo', 'Objetivo de beneficio (%)') + inp('dteAviso', 'Aviso por tiempo (DTE)') + inp('dteCierre', 'Cierre por tiempo (DTE)') + inp('stopMult', 'Stop: pérdida = N × crédito'));
  h += `<button class="btn pri" onclick="guardarCfg()">Guardar ajustes</button>`;
  return h;
}

// ---------- navegación ----------
function setCfg(path, v) { const n = num(v); if (isFinite(n)) st.cfg[path] = n; }
function selT(t) {
  leerForm();
  if (st.f.t !== t) st.f = { t, venc: st.f.venc };
  render();
}
function abrir(t) { leerForm(); st.f = { t, venc: st.f.venc }; ir('validar'); }
function ir(v) { if (st.vista === 'validar') leerForm(); st.vista = v; st.accion = null; render(); window.scrollTo(0, 0); }

function render() {
  let body;
  const v = st.vista;
  if (v === 'ajustes') body = vAjustes();
  else if (st.cargando && !st.datos) body = '<div class="center">Cargando datos…</div>';
  else if (!st.datos) body = `<div class="center">No se pudieron cargar los datos.<br><span class="note">${esc(st.error || 'Configura la conexión en Ajustes.')}</span><br><br><button class="btn sec" onclick="cargar()">Reintentar</button></div>`;
  else if (v === 'validar') body = vValidar();
  else if (v === 'res' && st.res) body = vRes();
  else if (v === 'reg' && st.reg) body = vReg();
  else if (v === 'pos') body = vPos();
  else body = vRadar();
  const nu = st.datos ? urgentes() : 0;
  const tab = (id, ic, lab, on, badge) => `<button class="${on ? 'on' : ''}" onclick="ir('${id}')">${ic}<span>${lab}</span>${badge ? `<span class="badge">${badge}</span>` : ''}</button>`;
  document.getElementById('app').innerHTML = `<div class="wrap">${body}</div>
    <nav class="tabs">${tab('radar', ICON.radar, 'Radar', v === 'radar')}${tab('validar', ICON.check, 'Validar', ['validar', 'res', 'reg'].includes(v))}${tab('pos', ICON.pos, 'Posiciones', v === 'pos', nu)}${tab('ajustes', ICON.gear, 'Ajustes', v === 'ajustes')}</nav>`;
}

cargarCfg();
cargar();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
